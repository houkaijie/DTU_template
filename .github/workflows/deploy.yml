name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本项目为 vue-cli 3 + webpack 4, 必须在 Node 16 下构建
      # (Node 18+ 会报 "No module factory available for dependency type: CssDependency")
      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          VUE_APP_PUBLIC_PATH: './'
        run: npm run build:prod

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # GitHub Pages 静态展示
  deploy-pages:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

